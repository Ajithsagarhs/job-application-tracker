<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Job Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 10px;
            margin-top: 7px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #198754;
            color: white;
        }

        .back {
            display: inline-block;
            margin-top: 20px;
            margin-left: 10px;
            padding: 12px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Job Application</h1>

    <form
        action="/update/{{ job['id'] }}"
        method="POST"
    >

        <label>Company Name</label>

        <input
            type="text"
            name="company"
            value="{{ job['company'] }}"
            required
        >


        <label>Job Role</label>

        <input
            type="text"
            name="role"
            value="{{ job['role'] }}"
            required
        >


        <label>Application Date</label>

        <input
            type="date"
            name="application_date"
            value="{{ job['application_date'] }}"
        >


        <label>Application Status</label>

        <select name="status">

            <option value="Applied"
                {% if job['status'] == 'Applied' %}
                selected
                {% endif %}
            >
                Applied
            </option>

            <option value="Interview"
                {% if job['status'] == 'Interview' %}
                selected
                {% endif %}
            >
                Interview
            </option>

            <option value="Rejected"
                {% if job['status'] == 'Rejected' %}
                selected
                {% endif %}
            >
                Rejected
            </option>

            <option value="Selected"
                {% if job['status'] == 'Selected' %}
                selected
                {% endif %}
            >
                Selected
            </option>

        </select>


        <label>Interview Date</label>

        <input
            type="date"
            name="interview_date"
            value="{{ job['interview_date'] }}"
        >


        <label>Job URL</label>

        <input
            type="url"
            name="job_url"
            value="{{ job['job_url'] }}"
        >


        <label>Notes</label>

        <textarea name="notes">{{ job['notes'] }}</textarea>


        <button type="submit">
            Update Application
        </button>

        <a
            href="/"
            class="back"
        >
            Back
        </a>

    </form>

</div>

</body>

</html>
