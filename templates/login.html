<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | JobTracker</title>

    <style>
        .password-box {
    position: relative;
}

.password-box input {
    padding-right: 65px;
}

.show-password {
    position: absolute;

    right: 10px;
    top: 50%;

    transform: translateY(-50%);

    border: none;
    background: transparent;

    color: #008f72;

    font-size: 11px;
    font-weight: 700;

    cursor: pointer;
}

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f6f8f7;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #17211d;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 25px;
        }

        .logo span {
            color: #008f72;
        }

        .card {
            background: white;
            border: 1px solid #e4e8e6;
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 8px 30px rgba(0,0,0,.04);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #737d78;
            font-size: 13px;
            margin-bottom: 25px;
        }

        .flash {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        .flash.error {
            background: #fff0f0;
            color: #c00000;
            border: 1px solid #efcaca;
        }

        .flash.success {
            background: #e6f5f0;
            color: #007d64;
            border: 1px solid #b9e4d7;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .required {
            color: #d00000;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #dfe4e2;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #008f72;
            box-shadow: 0 0 0 3px rgba(0,143,114,.08);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #008f72;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #00745d;
        }

        .signup-text {
            text-align: center;
            margin-top: 22px;
            color: #737d78;
            font-size: 13px;
        }

        .signup-text a {
            color: #008f72;
            text-decoration: none;
            font-weight: 700;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


<div class="container">


    <div class="logo">
        Job<span>Tracker</span>
    </div>


    <div class="card">


        <h1>
            Welcome back
        </h1>


        <p class="subtitle">
            Login to continue managing your job applications.
        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST"
              action="/login">


            <div class="form-group">

                <label>
                    Email
                    <span class="required">*</span>
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                    <span class="required">*</span>
                </label>

                <div class="password-box">

    <input
        type="password"
        id="loginPassword"
        name="password"
        placeholder="Enter your password"
        required
    >

    <button
        type="button"
        class="show-password"
        onclick="togglePassword('loginPassword', this)"
    >
        Show
    </button>

</div>

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


        </form>


        <div class="signup-text">

            Don't have an account?

            <a href="/signup">
                Create an account
            </a>

        </div>


    </div>

</div>


</body>

</html>
